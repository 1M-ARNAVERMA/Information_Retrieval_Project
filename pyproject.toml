[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fever-x"
version = "1.0.0"
description = "Explainable Multi-Stage Fact Verification using Entity-Aware Neural Retrieval and Knowledge Graph Reasoning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "FEVER-X Development Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "colorlog>=6.7.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "spacy>=3.7.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "rank-bm25>=0.2.2",
    "torch>=2.1.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "networkx>=3.2.1",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
]

[project.scripts]
feverx = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "frontend*"]
